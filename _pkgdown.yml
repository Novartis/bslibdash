url: https://opensource.nibr.com/bslibdash/

home:
  title: "bslibdash: Modern sidebar navigation for Shiny"
  description: >
    bslibdash provides dashboard-style sidebar navigation for Shiny
    applications built with bslib and Bootstrap 5 - sidebar menus,
    nested navigation, badges, and tab-oriented dashboard layouts.
    Developed by Novartis.

template:
  bootstrap: 5
  bslib:
    primary: "#0460A9"
    body-color: "#111827"
    font-family-sans-serif: >-
      system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue",
      Arial, "Noto Sans", "Liberation Sans", sans-serif
    font-size-base: "1rem"
    line-height-base: 1.45
    headings-font-weight: 650
    headings-line-height: 1.15
    border-radius: ".75rem"
    border-radius-sm: ".5rem"
    border-radius-lg: "1rem"
    enable-shadows: true

development:
  mode: auto

navbar:
  structure:
    left: [intro, articles, reference, news]
    right: [search, github]
  components:
    articles:
      text: Articles
      menu:
      - text: "Sidebar navigation in Shiny"
        href: articles/sidebar-navigation.html
      - text: "Migrating from shinydashboard"
        href: articles/sidebar-navigation.html#migrating-from-shinydashboard
      - text: "Migrating from bs4Dash"
        href: articles/sidebar-navigation.html#migrating-from-bs4dash
      - text: "-------"
      - text: "Get started"
        href: articles/getting-started.html
      - text: "Components"
        href: articles/components.html
      - text: "Theming"
        href: articles/theming.html

articles:
  - title: Articles
    navbar: ~
    contents:
      - sidebar-navigation
      - getting-started
      - components
      - theming

reference:
  - title: Page layout
    desc: >
      The dashboard page shell and its top-level regions.
    contents:
      - dashboardPage
      - dashboardHeader
      - dashboardSidebar
      - dashboardBody
      - dashboardFooter

  - title: Sidebar navigation
    desc: Sidebar menus, sub-items and the user panel.
    contents:
      - sidebarMenu
      - sidebarMenuOutput
      - sidebarUserPanel
      - sidebarSearchForm

  - title: Body content
    desc: Tabsets and grid helpers for laying out dashboard content.
    contents:
      - tabItem
      - tabsetPanel
      - updateTabItems
      - boxLayout
      - column

  - title: Cards and boxes
    desc: Collapsible/closable cards and tabbed cards.
    contents:
      - box
      - tabBox

  - title: KPI tiles
    desc: Value boxes and info boxes for headline metrics.
    contents:
      - valueBox
      - valueBoxOutput
      - renderValueBox
      - infoBox
      - infoBoxOutput
      - renderInfoBox

  - title: Header widgets
    desc: Header dropdown menus for messages, notifications and tasks.
    contents:
      - dropdownMenu
      - dropdownMenuOutput
      - renderDropdownMenu
      - menuItemOutput
      - renderMenu

  - title: Feedback and inputs
    desc: Accordions, badges, buttons, icons and toasts.
    contents:
      - accordion
      - badge
      - actionButton
      - icon
      - toast

  - title: Theming
    desc: Bootstrap 5 / bslib theme helpers.
    contents:
      - brand_bs_theme

  - title: Package
    contents:
      - bslibdash-package
